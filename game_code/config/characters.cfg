# 角色配置文件
# 格式说明：
#   [character] 开始一个新角色定义
#   name    = 角色名称
#   team    = 队伍编号 (1 = 队伍A, 2 = 队伍B)
#   hp      = 最大血量 (初始血量)
#   ap      = 初始行动点 (行动点上限固定为 10)
#   baseDamage = 基础伤害值
#   strength = 力量 x  (攻击伤害 = 基础伤害 x (1 + x/50))
#   defense  = 防御 y  (受到伤害 = 攻击伤害 x (1/(1 + y/50)))
#   luck     = 运气 z  (z/50 概率闪避攻击)
#   speed    = 速度 p  (速度条每行动一次增加 p)
#   skills = 以下每行定义一个技能:  技能名 cost=行动点消耗 mult=伤害倍率

